<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Digestivo - 5to Grado</title>
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Marcadores Superiores (Puntos y Tiempo) */
        #top-bar {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 20px;
        }

        .hud-box {
            font-size: 1.8rem;
            font-weight: bold;
            background-color: #111;
            padding: 10px 25px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }

        #timer-box {
            border-color: #FF3333;
            color: #FF3333;
        }

        #pregunta-box {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            max-width: 800px;
            line-height: 1.4;
            margin-top: 60px;
        }

        #mensaje-box {
            font-size: 2rem;
            font-weight: bold;
            min-height: 70px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .icono-feedback {
            font-size: 2.5rem;
        }

        .correcto { color: #00FF00; }
        .incorrecto { color: #FF3333; }

        #estado {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #888;
        }

        button {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover { background-color: #e6c200; }
    </style>
</head>
<body>

    <!-- Marcadores Superiores -->
    <div id="top-bar">
        <div class="hud-box">Puntos: <span id="puntos">0</span></div>
        <div class="hud-box" id="timer-box">⏱️ Tiempo: <span id="tiempo">10</span>s</div>
    </div>

    <div id="pregunta-box">Conecta la Micro:bit para comenzar...</div>
    <div id="mensaje-box"></div>
    
    <button id="btn-conectar">🔌 Conectar Micro:bit</button>

    <div id="estado">Estado: Desconectado</div>

    <script>
        const preguntasOriginales = [
            { texto: "¿Dónde comienza la digestión y se trituran los alimentos?", respuesta: "boca" },
            { texto: "¿Qué tubo musculoso conecta la boca con el estómago?", respuesta: "esofago" },
            { texto: "¿En qué órgano los jugos gástricos mezclan y descomponen los alimentos?", respuesta: "estomago" },
            { texto: "¿Dónde se absorben los nutrientes principales hacia la sangre?", respuesta: "intestino_delgado" },
            { texto: "¿Qué órgano absorbe el agua y forma la materia fecal?", respuesta: "intestino_grueso" },
            { texto: "¿Qué glándula produce la bilis para ayudar a digerir las grasas?", respuesta: "higado" },
            { texto: "¿Qué órgano produce jugos digestivos e insulina?", respuesta: "pancreas" },
            { texto: "¿Cuál es el tramo final del tubo digestivo por donde se expulsan los desechos?", respuesta: "recto" },
            { texto: "¿Qué estructura evita que la comida pase a la vía respiratoria?", respuesta: "epiglotis" }
        ];

        let preguntasMezcladas = [];
        let indiceActual = 0;
        let puntosTotales = 0;
        let bloqueado = false;
        let tiempoRestante = 10;
        let timerInterval = null;

        let port;
        let reader;

        const elPregunta = document.getElementById('pregunta-box');
        const elMensaje = document.getElementById('mensaje-box');
        const elPuntos = document.getElementById('puntos');
        const elTiempo = document.getElementById('tiempo');
        const elEstado = document.getElementById('estado');
        const btnConectar = document.getElementById('btn-conectar');

        function mezclarPreguntas() {
            preguntasMezcladas = [...preguntasOriginales];
            for (let i = preguntasMezcladas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [preguntasMezcladas[i], preguntasMezcladas[j]] = [preguntasMezcladas[j], preguntasMezcladas[i]];
            }
        }

        // Inicia la cuenta regresiva de 10 segundos
        function iniciarTemporizador() {
            detenerTemporizador();
            tiempoRestante = 10;
            elTiempo.textContent = tiempoRestante;

            timerInterval = setInterval(() => {
                tiempoRestante--;
                elTiempo.textContent = tiempoRestante;

                if (tiempoRestante <= 0) {
                    detenerTemporizador();
                    tiempoAgotado();
                }
            }, 1000);
        }

        function detenerTemporizador() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Caso: Se acabaron los 10 segundos
        function tiempoAgotado() {
            bloqueado = true;
            elMensaje.innerHTML = `<span class="icono-feedback incorrecto">⏰</span> <span class="incorrecto">¡TIEMPO AGOTADO! (0 Puntos)</span>`;

            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1500);
        }

        function cargarPregunta() {
            bloqueado = false;

            if (indiceActual < preguntasMezcladas.length) {
                elPregunta.textContent = `${indiceActual + 1}. ${preguntasMezcladas[indiceActual].texto}`;
                elMensaje.textContent = '';
                elMensaje.className = '';
                iniciarTemporizador(); // Arranca el reloj para la nueva pregunta
            } else {
                // Final de las 9 preguntas
                detenerTemporizador();
                elPregunta.textContent = `🎉 ¡TRIVIA COMPLETADA! 🎉`;
                elMensaje.innerHTML = `<span class="correcto">Puntaje Final: ${puntosTotales} de ${preguntasMezcladas.length * 10} puntos (${puntosTotales / 10} de ${preguntasMezcladas.length} correctas).</span><br><br><small style="color:#FFD700">Presiona el BOTÓN A en la Micro:bit para volver a jugar.</small>`;
            }
        }

        function reiniciarJuego() {
            detenerTemporizador();
            indiceActual = 0;
            puntosTotales = 0;
            elPuntos.textContent = puntosTotales;
            mezclarPreguntas();
            cargarPregunta();
        }

        function procesarRespuesta(respuestaRecibida) {
            const respuestaLimpia = respuestaRecibida.trim().toLowerCase();

            if (respuestaLimpia === "reiniciar") {
                reiniciarJuego();
                return;
            }

            if (indiceActual >= preguntasMezcladas.length || bloqueado) return;

            // Al responder, detenemos el reloj
            detenerTemporizador();
            bloqueado = true; 

            const respuestaCorrecta = preguntasMezcladas[indiceActual].respuesta;

            if (respuestaLimpia === respuestaCorrecta) {
                puntosTotales += 10;
                elPuntos.textContent = puntosTotales;
                elMensaje.innerHTML = `<span class="icono-feedback">✔️</span> <span class="correcto">¡CORRECTO! (+10 Puntos)</span>`;
            } else {
                elMensaje.innerHTML = `<span class="icono-feedback incorrecto">❌</span> <span class="incorrecto">INCORRECTO (0 Puntos)</span>`;
            }

            // Espera 1.5 segundos para mostrar el feedback y pasa a la siguiente
            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1500);
        }

        async function conectarMicrobit() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                elEstado.textContent = "Estado: ¡Micro:bit Conectada!";
                elEstado.style.color = "#00FF00";
                btnConectar.style.display = "none";
                
                reiniciarJuego();

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lineas = buffer.split("\n");
                        buffer = lineas.pop(); 
                        for (let linea of lineas) {
                            if (linea.trim() !== "") {
                                procesarRespuesta(linea);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error al conectar:", error);
                elEstado.textContent = "Estado: Error de conexión o cancelado";
            }
        }

        btnConectar.addEventListener('click', conectarMicrobit);
    </script>
</body>
</html>
