<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Digestivo - 5to Grado</title>
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #pregunta-box {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 30px;
            max-width: 800px;
            line-height: 1.4;
        }

        #mensaje-box {
            font-size: 2rem;
            font-weight: bold;
            min-height: 60px;
            margin-bottom: 20px;
        }

        .correcto {
            color: #00FF00;
        }

        .incorrecto {
            color: #FF3333;
        }

        #estado {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #888;
        }

        button {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #e6c200;
        }
    </style>
</head>
<body>

    <div id="pregunta-box">Cargando pregunta...</div>
    <div id="mensaje-box"></div>
    
    <button id="btn-conectar">Conectar Micro:bit</button>
    <div id="estado">Estado: Desconectado</div>

    <script>
        // Banco de preguntas y respuestas correctas (asociadas a los datos que manda la Micro:bit)
        const preguntas = [
            { texto: "¿Dónde comienza la digestión y se tritura la comida?", respuesta: "boca" },
            { texto: "¿Qué órgano mezcla los alimentos con jugos gástricos?", respuesta: "estomago" },
            { texto: "¿Dónde se absorben los nutrientes principales hacia la sangre?", respuesta: "intestino_delgado" },
            { texto: "¿Qué órgano absorbe el agua y forma la materia fecal?", respuesta: "intestino_grueso" }
        ];

        let indiceActual = 0;
        let port;
        let reader;

        const elPregunta = document.getElementById('pregunta-box');
        const elMensaje = document.getElementById('mensaje-box');
        const elEstado = document.getElementById('estado');
        const btnConectar = document.getElementById('btn-conectar');

        // Mostrar la primera pregunta al abrir la página
        function cargarPregunta() {
            if (indiceActual < preguntas.length) {
                elPregunta.textContent = `Pregunta ${indiceActual + 1}: ${preguntas[indiceActual].texto}`;
                elMensaje.textContent = '';
                elMensaje.className = '';
            } else {
                elPregunta.textContent = "¡Felicitaciones! Has completado todo el juego del Sistema Digestivo 🎉";
                elMensaje.textContent = '';
            }
        }

        // Verificar la respuesta enviada por la Micro:bit
        function procesarRespuesta(respuestaRecibida) {
            const respuestaLimpia = respuestaRecibida.trim().toLowerCase();
            const respuestaCorrecta = preguntas[indiceActual].respuesta;

            if (respuestaLimpia === respuestaCorrecta) {
                elMensaje.textContent = ">>> ¡EXCELENTE! ¡RESPUESTA CORRECTA! <<<";
                elMensaje.className = "correcto";
                
                // Pasar a la siguiente pregunta tras 2 segundos
                setTimeout(() => {
                    indiceActual++;
                    cargarPregunta();
                }, 2000);
            } else {
                elMensaje.textContent = ">>> X INCORRECTO! Intenta con otro órgano. <<<";
                elMensaje.className = "incorrecto";
            }
        }

        // Conexión WebUSB con la Micro:bit
        async function conectarMicrobit() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                elEstado.textContent = "Estado: ¡Micro:bit Conectada!";
                elEstado.style.color = "#00FF00";
                btnConectar.style.display = "none";

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lineas = buffer.split("\n");
                        buffer = lineas.pop(); // Mantener lo incompleto en el buffer
                        for (let linea of lineas) {
                            if (linea.trim() !== "") {
                                procesarRespuesta(linea);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error al conectar:", error);
                elEstado.textContent = "Estado: Error de conexión o cancelado";
            }
        }

        btnConectar.addEventListener('click', conectarMicrobit);

        // Iniciar la primera pregunta al cargar la página
        window.onload = cargarPregunta;
    </script>
</body>
</html>
