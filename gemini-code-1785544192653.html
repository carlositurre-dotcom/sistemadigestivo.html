<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Digestivo - 5to Grado</title>
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Marcador de Puntos Superior */
        #marcador {
            position: absolute;
            top: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            background-color: #111;
            padding: 10px 25px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }

        #pregunta-box {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            max-width: 800px;
            line-height: 1.4;
            margin-top: 60px;
        }

        #mensaje-box {
            font-size: 2rem;
            font-weight: bold;
            min-height: 70px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .icono-feedback {
            font-size: 2.5rem;
        }

        .correcto { color: #00FF00; }
        .incorrecto { color: #FF3333; }

        #estado {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #888;
        }

        button {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover { background-color: #e6c200; }

        #acciones-container {
            display: none;
            flex-direction: row;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
        }

        #btn-reintentar {
            background-color: #FF3333;
            color: #FFF;
        }
        #btn-reintentar:hover { background-color: #cc0000; }

        #btn-continuar {
            background-color: #00FF00;
            color: #000;
        }
        #btn-continuar:hover { background-color: #00cc00; }
    </style>
</head>
<body>

    <!-- Marcador de Puntuación -->
    <div id="marcador">Puntos: <span id="puntos">0</span></div>

    <div id="pregunta-box">Conecta la Micro:bit para comenzar...</div>
    <div id="mensaje-box"></div>
    
    <button id="btn-conectar">🔌 Conectar Micro:bit</button>

    <div id="acciones-container">
        <button id="btn-reintentar">Intenta nuevamente</button>
        <button id="btn-continuar">Continúa</button>
    </div>

    <div id="estado">Estado: Desconectado</div>

    <script>
        // Banco de las 9 preguntas vinculadas a los pines (P1 a P9)
        const preguntas = [
            { texto: "1. ¿Dónde comienza la digestión y se trituran los alimentos?", respuesta: "boca" },
            { texto: "2. ¿Qué tubo musculoso conecta la boca con el estómago?", respuesta: "esofago" },
            { texto: "3. ¿En qué órgano los jugos gástricos mezclan y descomponen los alimentos?", respuesta: "estomago" },
            { texto: "4. ¿Dónde se absorben los nutrientes principales hacia la sangre?", respuesta: "intestino_delgado" },
            { texto: "5. ¿Qué órgano absorbe el agua y forma la materia fecal?", respuesta: "intestino_grueso" },
            { texto: "6. ¿Qué glándula produce la bilis para ayudar a digerir las grasas?", respuesta: "higado" },
            { texto: "7. ¿Qué órgano produce jugos digestivos e insulina?", respuesta: "pancreas" },
            { texto: "8. ¿Cuál es el tramo final del tubo digestivo por donde se expulsan los desechos?", respuesta: "recto" },
            { texto: "9. ¿Qué estructura evita que la comida pase a la vía respiratoria?", respuesta: "epiglotis" }
        ];

        let indiceActual = 0;
        let puntosTotales = 0;
        let respondidoEnEstaPregunta = false;
        let port;
        let reader;

        const elPregunta = document.getElementById('pregunta-box');
        const elMensaje = document.getElementById('mensaje-box');
        const elPuntos = document.getElementById('puntos');
        const elEstado = document.getElementById('estado');
        const btnConectar = document.getElementById('btn-conectar');
        const elAccionesContainer = document.getElementById('acciones-container');
        const btnReintentar = document.getElementById('btn-reintentar');
        const btnContinuar = document.getElementById('btn-continuar');

        function ocultarAcciones() {
            elAccionesContainer.style.display = 'none';
        }

        function mostrarAccion(tipo) {
            elAccionesContainer.style.display = 'flex';
            if (tipo === 'correcto') {
                btnReintentar.style.display = 'none';
                btnContinuar.style.display = 'inline-block';
            } else if (tipo === 'incorrecto') {
                btnReintentar.style.display = 'inline-block';
                btnContinuar.style.display = 'none';
            }
        }

        function cargarPregunta() {
            ocultarAcciones();
            respondidoEnEstaPregunta = false;

            if (indiceActual < preguntas.length) {
                elPregunta.textContent = preguntas[indiceActual].texto;
                elMensaje.textContent = '';
                elMensaje.className = '';
            } else {
                // Final del juego
                elPregunta.textContent = `🎉 ¡TRIVIA COMPLETADA! 🎉`;
                elMensaje.innerHTML = `<span class="correcto">Puntaje Final: ${puntosTotales} de ${preguntas.length * 10} puntos.</span><br><br><small style="color:#FFD700">Presiona el BOTÓN A en la Micro:bit para reiniciar.</small>`;
            }
        }

        function reiniciarJuego() {
            indiceActual = 0;
            puntosTotales = 0;
            elPuntos.textContent = puntosTotales;
            cargarPregunta();
        }

        function procesarRespuesta(respuestaRecibida) {
            const respuestaLimpia = respuestaRecibida.trim().toLowerCase();

            // Comando de reinicio desde la Micro:bit (Botón A)
            if (respuestaLimpia === "reiniciar") {
                reiniciarJuego();
                return;
            }

            if (indiceActual >= preguntas.length || respondidoEnEstaPregunta) return;

            const respuestaCorrecta = preguntas[indiceActual].respuesta;

            if (respuestaLimpia === respuestaCorrecta) {
                puntosTotales += 10;
                elPuntos.textContent = puntosTotales;
                respondidoEnEstaPregunta = true;

                elMensaje.innerHTML = `<span class="icono-feedback">✔️</span> <span class="correcto">¡EXCELENTE! RESPUESTA CORRECTA (+10 Puntos)</span>`;
                mostrarAccion('correcto');
            } else {
                elMensaje.innerHTML = `<span class="icono-feedback incorrecto">❌</span> <span class="incorrecto">INCORRECTO (0 Puntos)</span>`;
                mostrarAccion('incorrecto');
            }
        }

        btnReintentar.addEventListener('click', () => {
            elMensaje.textContent = '';
            ocultarAcciones();
        });

        btnContinuar.addEventListener('click', () => {
            indiceActual++;
            cargarPregunta();
        });

        async function conectarMicrobit() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                elEstado.textContent = "Estado: ¡Micro:bit Conectada!";
                elEstado.style.color = "#00FF00";
                btnConectar.style.display = "none";
                cargarPregunta();

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lineas = buffer.split("\n");
                        buffer = lineas.pop(); 
                        for (let linea of lineas) {
                            if (linea.trim() !== "") {
                                procesarRespuesta(linea);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error al conectar:", error);
                elEstado.textContent = "Estado: Error de conexión o cancelado";
            }
        }

        btnConectar.addEventListener('click', conectarMicrobit);
    </script>
</body>
</html>
